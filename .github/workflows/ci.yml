name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: convictionos
          POSTGRES_USER: convictionos
          POSTGRES_PASSWORD: convictionos
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U convictionos -d convictionos"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      postgres_test:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: convictionos_test
          POSTGRES_USER: convictionos
          POSTGRES_PASSWORD: convictionos
        ports:
          - 54330:5432
        options: >-
          --health-cmd "pg_isready -U convictionos -d convictionos_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src/convictionos
      - run: uv run python scripts/check_architecture.py
      - run: uv run python scripts/check_claims.py --allow-missing-public-before-first-release
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://convictionos:convictionos@localhost:54330/convictionos_test
